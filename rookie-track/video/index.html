<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rookie Track Video Lab · SLTN Labs</title>
<meta name="description" content="Early preview: upload a shooting video, tap your player, get a skill report. Runs entirely in your browser.">
<meta name="theme-color" content="#0F1B2D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: one column — set-up strip (video, tap, analyse) on top, then the report: summary + actions, radar + priorities, evidence viewer, shot table, numbers, drills, method. */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --sunk: #F5F7FA; --line: #DCE2EA;
  --ink: #0F1B2D; --muted: #566174; --nav: #0F1B2D; --nav-ink: #FFFFFF; --nav-muted: #B8C2D1;
  --accent: #C2410C; --accent-mark: #F97316; --accent-soft: #FFF1E7; --accent-ink: #9A3412;
  --ref: #2F5BD3; --ref-soft: #EDF2FF; --ref-ink: #1E40AF;
  --good: #15803D; --good-soft: #DCFCE7; --warn: #92400E; --warn-soft: #FEF3C7;
  --display: "Barlow Condensed", "Cairo", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Cairo", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1220; --surface: #141E2E; --sunk: #1A2638; --line: #2A3850;
  --ink: #E8EDF4; --muted: #9AA7BA; --nav: #070C16; --nav-ink: #FFFFFF; --nav-muted: #9AA7BA;
  --accent: #F97316; --accent-mark: #FB923C; --accent-soft: #3A1F10; --accent-ink: #FDBA74;
  --ref: #7EA2FF; --ref-soft: #18244A; --ref-ink: #A9C1FF;
  --good: #4ADE80; --good-soft: #10301E; --warn: #FCD34D; --warn-soft: #3A2E0E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #141E2E; --sunk: #1A2638; --line: #2A3850;
  --ink: #E8EDF4; --muted: #9AA7BA; --nav: #070C16; --nav-ink: #FFFFFF; --nav-muted: #9AA7BA;
  --accent: #F97316; --accent-mark: #FB923C; --accent-soft: #3A1F10; --accent-ink: #FDBA74;
  --ref: #7EA2FF; --ref-soft: #18244A; --ref-ink: #A9C1FF;
  --good: #4ADE80; --good-soft: #10301E; --warn: #FCD34D; --warn-soft: #3A2E0E; color-scheme: dark }
html[lang="ar"] { --display: "Cairo", Arial, sans-serif; --body: "Cairo", "Segoe UI", Arial, sans-serif; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.2px; }
h2 { font-size: 26px; line-height: 1.15; }
html[lang="ar"] h2 { font-size: 23px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: 13px; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; }
:focus-visible { outline: 3px solid var(--accent-mark); outline-offset: 2px; }

header.top { background: var(--nav); color: var(--nav-ink); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1.5px; direction: ltr; }
.topright { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--nav-muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--nav-muted); }
.dot.ok { background: #4ADE80; } .dot.busy { background: #FBBF24; } .dot.bad { background: #F87171; }
.lang { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #3A4A63; background: transparent; color: var(--nav-ink); font-weight: 600; cursor: pointer; }

main { display: flex; flex-direction: column; gap: 22px; padding-block: 24px 40px; }
.card { background: var(--surface); border-radius: 14px; padding: 20px 22px; border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 22px; }
.row > * { min-width: 0; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--nav); color: #fff; border-color: var(--nav); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.setup { display: flex; flex-wrap: wrap; gap: 22px; }
.stage { flex: 1.6 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.controls { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.canvasbox { position: relative; width: 100%; max-width: 100%; background: #1A2332; border-radius: 12px; overflow: hidden; }
#stage { width: 100%; display: block; cursor: crosshair; touch-action: manipulation; max-height: 70vh; object-fit: contain; }
.hint { position: absolute; inset-inline-start: 12px; top: 12px; background: rgba(15,27,45,0.82); color: #fff; font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 8px; pointer-events: none; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; min-height: 44px; border: 0; background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--nav); color: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; }
.two { display: flex; gap: 12px; flex-wrap: wrap; }
.two > .field { flex: 1 1 130px; min-width: 0; }
select, input[type="text"] { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; }
.marks { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ok-t { color: var(--good); font-weight: 600; } .no-t { color: var(--muted); font-weight: 600; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.ptop { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.track span { display: block; height: 100%; width: 0; background: var(--accent-mark); transition: width 0.2s; }
.tips { font-size: 14px; color: var(--muted); margin: 6px 0 0; padding-inline-start: 18px; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 12px 16px; border-radius: 12px; background: var(--ref-soft); color: var(--ref-ink); font-weight: 500; font-size: 15px; }
.warnbox { padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 500; font-size: 15px; }

.summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
.who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.jersey { min-width: 58px; height: 58px; padding: 0 8px; border-radius: 12px; background: var(--nav); color: #fff; display: grid; place-items: center; font: 700 18px "Barlow Condensed", Arial, sans-serif; direction: ltr; }
.who h1 { font-size: 32px; line-height: 1.1; }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font: 700 60px/1 "Barlow Condensed", Arial, sans-serif; }
.delta { font-weight: 600; font-size: 14px; }
.delta.up { color: var(--good); } .delta.down { color: var(--accent-ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; border-top: 1px solid var(--line); padding-top: 14px; }
.actions .note { font-size: 13px; color: var(--muted); }
.actmsg { font-size: 14px; font-weight: 600; }
.actmsg.ok { color: var(--good); } .actmsg.bad { color: var(--accent-ink); }

.radar-card { flex: 1 1 360px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 3px solid var(--accent-mark); vertical-align: middle; margin-inline-end: 6px; }
.legend i.prev { border-top: 2px dashed var(--ref); }
#radar { width: 100%; max-width: 500px; display: block; margin: 8px auto 0; }
.prio { flex: 1.4 1 460px; display: flex; flex-direction: column; gap: 12px; }
.finding { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); }
.finding[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-mark); }
.rank { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--nav); color: #fff; display: grid; place-items: center; font: 700 20px "Barlow Condensed", Arial, sans-serif; }
.finding .txt { flex: 1 1 220px; min-width: 0; }
.finding .t { font-weight: 600; font-size: 17px; line-height: 1.35; }
.finding .d { color: var(--muted); font-size: 14px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; margin-inline-start: 6px; text-transform: none; letter-spacing: 0; }
.chip.High { background: var(--good-soft); color: var(--good); }
.chip.Medium { background: var(--warn-soft); color: var(--warn); }
.strengths { font-size: 14px; color: var(--muted); margin: 0; }
.strengths b { color: var(--good); }

.ev-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--nav); color: #fff; border-color: var(--nav); }
.panes { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
figure { flex: 1 1 340px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
figcaption { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
figcaption span { color: var(--muted); font-weight: 500; }
.frame { width: 100%; max-width: 100%; aspect-ratio: 6 / 5; border-radius: 12px; overflow: hidden; background: #1A2332; position: relative; }
.frame img, .frame canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.facts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
.fact { flex: 1 1 160px; border-radius: 12px; padding: 12px 16px; }
.fact.m { background: var(--accent-soft); } .fact.m .eyebrow { color: var(--accent-ink); }
.fact.i { background: var(--ref-soft); } .fact.i .eyebrow { color: var(--ref-ink); }
.fact b { font-size: 20px; direction: ltr; unicode-bidi: isolate; }
.fact.cue { flex: 3 1 320px; background: var(--sunk); }
.fact.cue p { margin: 2px 0 0; font-weight: 500; }
.playrow { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

.tablebox { overflow-x: auto; margin-top: 12px; }
table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: 15px; }
th { text-align: start; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
html[lang="ar"] th { letter-spacing: 0; font-size: 13px; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td.off { color: var(--accent-ink); font-weight: 600; }
td.off::after { content: " ●"; font-size: 10px; vertical-align: middle; }
.ltr { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.res { font-weight: 600; } .res.made { color: var(--good); } .res.miss { color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
.tile { flex: 1 1 200px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font: 700 34px/1.15 "Barlow Condensed", Arial, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; text-align: start; unicode-bidi: plaintext; }
.tile .note { font-size: 14px; color: var(--muted); }
.tile .note.off { color: var(--accent-ink); font-weight: 600; }
.tile .note.ok { color: var(--good); font-weight: 600; }
.method { display: flex; flex-wrap: wrap; gap: 22px; }
.method > div { flex: 1 1 280px; min-width: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; margin-top: 4px; }
.bar span { display: block; height: 100%; background: var(--good); }
.qrow { display: flex; justify-content: space-between; font-size: 14px; margin-top: 10px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
footer { color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
footer svg { flex: none; margin-top: 2px; }
.err { color: var(--accent-ink); font-weight: 600; font-size: 14px; margin: 0; }
#vid { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; z-index: -1; }
.homelink { flex-basis: 100%; color: var(--nav-muted); font-size: 14px; font-weight: 600; text-decoration: none; }
.homelink:hover { color: var(--nav-ink); text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <a class="homelink" href="/" data-t="nav.home"></a>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#F97316" stroke-width="2.5"/><path d="M2 15h26M15 2v26M6 6c5 4 5 14 0 18M24 6c-5 4-5 14 0 18" fill="none" stroke="#F97316" stroke-width="2"/></svg>
      ROOKIE TRACK <span style="font-size:15px;letter-spacing:1px;color:var(--nav-muted);margin-left:4px">VIDEO LAB</span>
    </div>
    <div class="topright">
      <div class="status" role="status"><span class="dot busy" id="mdot"></span><span id="mstat"></span></div>
      <button class="lang" id="lang" type="button" lang="ar">العربية</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card" aria-labelledby="setup-h">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
      <div><h2 id="setup-h" data-t="setup.title"></h2><p class="sub" data-t="setup.sub"></p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="use-sample" type="button" data-t="setup.sample"></button>
        <label class="btn dark file" for="upload">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          <span data-t="setup.upload"></span>
          <input type="file" id="upload" accept="video/*">
        </label>
      </div>
    </div>
    <div class="setup">
      <div class="stage">
        <div class="canvasbox"><canvas id="stage" width="960" height="540"></canvas><div class="hint" id="hint"></div></div>
        <p class="sub ltr" id="vinfo" style="text-align:start"></p>
      </div>
      <div class="controls">
        <div class="field"><span class="eyebrow" data-t="setup.marking"></span>
          <div class="seg" role="group" id="modes">
            <button type="button" id="mode-player" aria-pressed="true" data-t="setup.modePlayer"></button>
            <button type="button" id="mode-rim" aria-pressed="false" data-t="setup.modeRim"></button>
          </div>
        </div>
        <div class="marks">
          <span><span data-t="setup.playerLbl"></span> <b id="m-player"></b></span>
          <span><span data-t="setup.rimLbl"></span> <b id="m-rim"></b></span>
        </div>
        <div class="two">
          <div class="field"><label class="eyebrow" for="code" data-t="setup.code"></label>
            <input type="text" id="code" maxlength="12" autocomplete="off" spellcheck="false" placeholder="HL-07" style="direction:ltr;text-transform:uppercase"></div>
          <div class="field"><label class="eyebrow" for="age" data-t="setup.age"></label>
            <select id="age"><option value="U12" data-t="age.U12"></option><option value="U16" data-t="age.U16"></option><option value="Adult" data-t="age.Adult"></option></select></div>
        </div>
        <p class="sub" id="session-note" style="margin-top:-8px"></p>
        <button class="btn primary" id="go" type="button" disabled style="min-height:52px;font-size:17px" data-t="setup.go"></button>
        <div class="progress" id="prog" hidden>
          <div class="ptop"><span id="ptext"></span><span class="num" id="ppct"></span></div>
          <div class="track"><span id="pbar"></span></div>
        </div>
        <p class="err" id="err" hidden></p>
        <details>
          <summary style="cursor:pointer;font-weight:600;font-size:14px" data-t="tips.title"></summary>
          <ul class="tips"><li data-t="tips.1"></li><li data-t="tips.2"></li><li data-t="tips.3"></li></ul>
        </details>
      </div>
    </div>
  </section>

  <div class="banner" id="banner" hidden></div>

  <div id="report" style="display:flex;flex-direction:column;gap:22px">
    <section class="card empty"><h2 data-t="empty.title"></h2><p class="sub" data-t="empty.sub"></p></section>
  </div>

  <footer>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>
    <span><span data-t="footer.privacy"></span> <span class="ltr">v0.2.1 · POC</span></span>
  </footer>
</main>
<video id="vid" muted playsinline preload="auto"></video>

<template id="report-tpl">
  <section class="card summary" aria-label="Summary">
    <div class="who"><div class="jersey" data-k="code"></div>
      <div style="min-width:0"><h1 data-k="title"></h1><p class="sub" data-k="meta"></p></div></div>
    <div class="score"><b class="num" data-k="overall"></b>
      <div style="display:flex;flex-direction:column"><span class="eyebrow" data-t="r.overall"></span><span class="delta" data-k="delta"></span></div></div>
    <div class="actions" data-k="actions" hidden>
      <button class="btn dark" type="button" data-k="send" hidden></button>
      <button class="btn" type="button" data-k="saveimg" hidden></button>
      <span class="note" data-k="sendnote" hidden></span>
      <span class="actmsg" data-k="actmsg" role="status"></span>
    </div>
  </section>
  <div class="warnbox" data-k="warn" hidden></div>
  <div class="row">
    <section class="card radar-card">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">
        <div><h2 data-t="r.radar"></h2><p class="sub" data-k="refnote"></p></div>
        <div class="legend"><span><i></i><span data-t="r.thisRun"></span></span><span data-k="lgprev"><i class="prev"></i><span data-k="lgprevtxt"></span></span></div>
      </div>
      <svg id="radar" viewBox="-110 -24 540 360" role="img"></svg>
    </section>
    <section class="card prio">
      <div><h2 data-t="r.prio"></h2><p class="sub" data-t="r.prioSub"></p></div>
      <div data-k="findings" style="display:flex;flex-direction:column;gap:12px"></div>
      <p class="strengths" data-k="strengths"></p>
    </section>
  </div>
  <section class="card" id="evidence">
    <div class="ev-head">
      <div><h2 data-t="r.ev"></h2><p class="sub" data-t="r.evSub"></p></div>
      <div class="tabs" role="tablist" data-k="tabs"></div>
    </div>
    <div class="panes">
      <figure><figcaption><span style="color:inherit;font-weight:600" data-t="r.fromVideo"></span> <span data-k="evwhen"></span></figcaption><div class="frame" data-k="evframe"></div></figure>
      <figure><figcaption><span style="color:inherit;font-weight:600" data-t="r.idealPos"></span> <span data-k="evref"></span></figcaption><div class="frame" style="background:var(--sunk)" data-k="idframe"></div></figure>
    </div>
    <div class="facts" data-k="facts">
      <div class="fact m"><div class="eyebrow" data-t="r.measured"></div><b class="num" data-k="fmeas"></b><div class="sub" data-k="fmeassub"></div></div>
      <div class="fact i"><div class="eyebrow" data-t="r.ideal"></div><b class="num" data-k="fideal"></b></div>
